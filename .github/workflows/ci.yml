name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test every package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:versions
      - name: Smoke the built CLI and the shims
        run: |
          node packages/cli/dist/bin/rness.js --version
          node packages/create-rness/index.js --help | grep -q 'Usage: rness create'
          node packages/create/index.js --help | grep -q 'Usage: rness create'
          PACK=$(cd packages/cli && npm pack --dry-run 2>&1)
          echo "$PACK"
          echo "$PACK" | grep -q 'scaffold/.githooks/pre-commit'
          echo "$PACK" | grep -q 'scaffold/pnpm-workspace.yaml'
