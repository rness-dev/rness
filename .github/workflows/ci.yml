name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test every package (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22: the runtime floor's line (ADR 0010); 24: the development floor.
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:versions
      - name: Smoke the built CLI and the shims
        run: |
          node packages/cli/dist/bin/rness.js --version
          node packages/create-rness/index.js --help | grep -q 'Usage: rness create'
          node packages/create/index.js --help | grep -q 'Usage: rness create'
          PACK=$(cd packages/cli && npm pack --dry-run 2>&1)
          echo "$PACK"
          echo "$PACK" | grep -q 'scaffold/.githooks/pre-commit'
          echo "$PACK" | grep -q 'scaffold/pnpm-workspace.yaml'
