name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Lockstep: every packages/*/package.json carries the same version, the
      # shims pin @rness/cli to it, and the tag names it (v0.4.0 releases 0.4.0).
      - run: pnpm check:versions --tag "$GITHUB_REF_NAME"

      # OIDC trusted publishing: no registry-url/NODE_AUTH_TOKEN here on purpose.
      # Either defeats OIDC by forcing npm onto token auth instead, which is
      # what produced ENEEDAUTH even though no real token was ever configured.
      - run: npm install -g npm@latest # trusted publishing needs npm >=11.5.0
      # cli, then create, then create-rness; a version already on npm is skipped,
      # so a re-run after a partial release (or a hand publish) goes green.
      - run: node scripts/publish.mjs
