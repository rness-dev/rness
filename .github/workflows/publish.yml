name: Publish

on:
  push:
    tags:
      - 'v*'

# Two jobs, so that the right to publish never meets the code of the
# dependencies: build installs, checks, compiles and packs without it; publish
# holds it and runs nothing of the project, only npm on the archives build
# made. Actions are pinned by commit: a tag can be moved, a commit cannot.
jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: the gate below compares the tag with main.
          fetch-depth: 0

      # Before anything of the project runs: the tagged commit is on main, or
      # the release stops here. A tag on any other commit would otherwise
      # publish whatever that commit holds, dependencies included.
      - name: The tagged commit must be on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $(git rev-parse --short HEAD), which is not on main: a release is tagged on main"
            exit 1
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No dependency cache for a release: every package comes from the
      # registry, as the lockfile names it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Lockstep: every packages/*/package.json carries the same version, the
      # shims pin @rness/cli to it, and the tag names it (v0.4.0 releases 0.4.0).
      - run: pnpm check:versions --tag "$GITHUB_REF_NAME"

      # One archive per package, named by npm (@rness/cli 0.22.0 packs as
      # rness-cli-0.22.0.tgz). A package the publish job does not name stops
      # the release here rather than staying unpublished.
      - name: Pack every package
        run: |
          for dir in packages/*/; do
            case "${dir%/}" in
              packages/cli | packages/create | packages/create-rness) ;;
              *)
                echo "::error::${dir%/} is not in the publish order (edit the publish job)"
                exit 1
                ;;
            esac
          done
          mkdir -p "$RUNNER_TEMP/tarballs"
          for dir in cli create create-rness; do
            (cd "packages/$dir" && npm pack --pack-destination "$RUNNER_TEMP/tarballs")
          done
          ls -l "$RUNNER_TEMP/tarballs"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarballs
          path: ${{ runner.temp }}/tarballs/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest

    # The only job allowed to publish. No contents: read, it checks nothing
    # out, and no step of it runs code of the project or of a dependency.
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarballs
          path: ${{ runner.temp }}/tarballs

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # OIDC trusted publishing: no registry-url/NODE_AUTH_TOKEN here on purpose.
      # Either defeats OIDC by forcing npm onto token auth instead, which is
      # what produced ENEEDAUTH even though no real token was ever configured.
      # npm is pinned (trusted publishing needs 11.5.0 or later): a release
      # does not run whatever @latest is that day.
      - run: npm install -g npm@12.2.0

      # cli, then create, then create-rness: the shims pin @rness/cli exactly.
      # A version already on npm is skipped, so a re-run after a partial
      # release (or a hand publish) goes green. Each archive is published as
      # built, --ignore-scripts: no lifecycle script of the package runs here.
      - name: Publish every archive not on npm yet
        working-directory: ${{ runner.temp }}/tarballs
        run: |
          version="${GITHUB_REF_NAME#v}"
          err="$RUNNER_TEMP/npm-view.err"
          for name in @rness/cli @rness/create create-rness; do
            file="${name#@}"
            file="${file//\//-}-$version.tgz"
            if ! [ -f "$file" ]; then
              echo "::error::$file is missing from the build"
              exit 1
            fi
            if on_npm="$(npm view "$name@$version" version 2> "$err")"; then
              if [ "$on_npm" = "$version" ]; then
                echo "skip     $name@$version (already on npm)"
                continue
              fi
            elif ! grep -q 'E404' "$err"; then
              echo "::error::npm view $name@$version failed"
              cat "$err"
              exit 1
            fi
            echo "publish  $name@$version"
            npm publish "./$file" --access public --ignore-scripts
          done

      # The docs freeze this version now, not at their next scheduled run,
      # which GitHub delays by hours: their Release workflow waits for npm to
      # answer the version, then opens the pull request that deploys it. The
      # tag is the only input. DOCS_RELEASE_TOKEN: a fine-grained token with
      # Actions read and write on the docs repository only. The packages are
      # out by now, so this step never fails the run.
      - name: Ask the docs to freeze this version
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DOCS_RELEASE_TOKEN }}
          DOCS: ${{ github.repository_owner }}/docs
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            *-*)
              echo "$version is a prerelease: the docs keep the release they show"
              exit 0
              ;;
          esac
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::DOCS_RELEASE_TOKEN is not set: the docs freeze $version at their next scheduled run"
            exit 0
          fi
          # A token refused (expired, wrong repository) is said as loudly as a
          # missing one: the docs would otherwise lag without anyone knowing.
          if ! gh workflow run Release -R "$DOCS" -f version="$version"; then
            echo "::warning::could not start the Release workflow of $DOCS: the docs freeze $version at their next scheduled run"
            exit 0
          fi
          echo "asked $DOCS to freeze $version"

  # The GitHub release of the tag, once its packages are on npm, through the
  # Release workflow, which also runs by hand. Only this job writes to the
  # repository; build and publish keep contents: read or less.
  release:
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ github.ref_name }}
